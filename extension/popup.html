<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { width: 272px; margin: 0; padding: 14px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1b2028; }
  h1 { font-size: 13px; margin: 0 0 4px; }
  p { margin: 0 0 10px; color: #5b6472; }
  .kind { margin: 0 0 10px; font-weight: 600; font-size: 12px; color: #2f4cdb; min-height: 1.1em; }
  label { display: block; font-size: 11.5px; font-weight: 600; color: #3a4150; margin: 0 0 4px; }
  input[type="text"] { width: 100%; box-sizing: border-box; padding: 7px 9px; font: inherit; border: 1px solid #dbdfe2; border-radius: 7px; background: #f5f6f3; margin: 0 0 10px; }
  input::placeholder { color: #8d96a6; }
  button { width: 100%; padding: 8px 10px; font: inherit; font-weight: 600; border-radius: 7px; border: 1px solid #2f4cdb; background: #2f4cdb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .status { margin-top: 10px; color: #5b6472; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Letterhead Quick Add</h1>
  <p>Reads this page and opens Letterhead with a new pending row.</p>
  <div class="kind" id="kind"></div>
  <label for="intent">What's it about? (optional)</label>
  <input type="text" id="intent" placeholder="e.g. email about a summer internship" maxlength="300" />
  <button id="grab">Grab this page</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
